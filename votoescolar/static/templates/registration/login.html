{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>Login - VOTOESCOLAR</title>
    <link rel="stylesheet" href="{% static 'bootstrap/css/bootstrap.min.css' %}">
    <link rel="stylesheet" href="{% static 'css/templatemo-grad-school.css' %}">
</head>
<body>
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-5">
            <div class="card shadow-sm">
                <div class="card-body">
                    <h3 class="card-title text-center mb-4">VOTOESCOLAR</h3>
                    {% if form.errors %}
                        <div class="alert alert-danger">Usuario o contraseña inválidos.</div>
                    {% endif %}
                    <form method="post">
                        {% csrf_token %}
                        <div class="form-group">
                            <label for="id_username">Usuario</label>
                            <input type="text" name="username" autofocus required class="form-control" id="id_username">
                        </div>
                        <div class="form-group">
                            <label for="id_password">Contraseña</label>
                            <input type="password" name="password" required class="form-control" id="id_password">
                        </div>
                        <button type="submit" class="btn btn-primary btn-block mt-3">Ingresar</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
