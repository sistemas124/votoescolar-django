{% extends 'base.html' %}

{% block title %}{{ title }} - VOTOESCOLAR{% endblock %}

{% block content %}
<div class="card p-4 shadow-lg border-0 rounded-3" style="background-color: #1e293b; color: #ffffff;">
    <!-- Encabezado -->
    <div class="d-flex justify-content-between align-items-center mb-4 pb-2 border-bottom border-secondary">
        <h2 class="m-0 text-white font-weight-bold">
            <i class="fa fa-id-card me-2 text-warning"></i> {{ title }}
        </h2>
        <a href="{% url 'elecciones:candidatura_list' %}" class="btn btn-outline-light btn-sm px-3">
            <i class="fa fa-arrow-left me-1"></i> Volver a la Lista
        </a>
    </div>

    <!-- Formulario de Candidatura -->
    <form method="POST" enctype="multipart/form-data">
        {% csrf_token %}
        
        <div class="row text-white">
            {% for field in form %}
                <div class="col-md-6 mb-3">
                    <label for="{{ field.id_for_label }}" class="form-label font-weight-bold text-light">
                        {{ field.label }}
                    </label>
                    
                    <div class="custom-input-wrapper">
                        {{ field }}
                    </div>

                    {% if field.errors %}
                        <div class="text-danger small mt-1 font-weight-bold">
                            <i class="fa fa-exclamation-circle me-1"></i>{{ field.errors|striptags }}
                        </div>
                    {% endif %}
                </div>
            {% endfor %}
        </div>

        <!-- Botones de Acción -->
        <div class="d-flex justify-content-end align-items-center gap-3 mt-4 pt-3 border-top border-secondary">
            <a href="{% url 'elecciones:candidatura_list' %}" class="btn btn-secondary px-4 py-2 me-2">
                Cancelar
            </a>
            
            <button type="submit" class="btn font-weight-bold px-4 py-2" style="background-color: #f5a425 !important; border-color: #f5a425 !important; color: #162239 !important; font-size: 1rem; display: inline-block !important; visibility: visible !important; opacity: 1 !important;">
                <i class="fa fa-save me-2"></i> Guardar Candidatura
            </button>
        </div>
    </form>
</div>

<style>
    .custom-input-wrapper input, 
    .custom-input-wrapper select, 
    .custom-input-wrapper textarea {
        width: 100%;
        padding: 0.375rem 0.75rem;
        background-color: #0f172a !important;
        color: #ffffff !important;
        border: 1px solid #475569 !important;
        border-radius: 0.375rem;
    }
    
    .custom-input-wrapper input:focus, 
    .custom-input-wrapper select:focus, 
    .custom-input-wrapper textarea:focus {
        border-color: #f5a425 !important;
        outline: none;
        box-shadow: 0 0 0 0.25rem rgba(245, 164, 37, 0.25);
    }
</style>
{% endblock %}
