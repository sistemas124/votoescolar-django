{% extends 'base.html' %}
{% block title %}Eliminar Estudiante - VOTOESCOLAR{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-6 col-12">
        <div class="card card-custom p-4 text-center border-danger">
            <i class="fa fa-exclamation-triangle fa-3x text-danger mb-3"></i>
            <h3 class="font-weight-bold text-white mb-2">¿Eliminar Estudiante?</h3>
            <p class="text-light mb-4">¿Estás seguro/a de eliminar al estudiante <strong>"{{ estudiante }}"</strong> del padrón?</p>

            <form method="post">
                {% csrf_token %}
                <a href="{% url 'elecciones:estudiante_list' %}" class="btn btn-secondary px-4 mr-2">Cancelar</a>
                <button type="submit" class="btn btn-danger px-4"><i class="fa fa-trash"></i> Sí, Eliminar</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
